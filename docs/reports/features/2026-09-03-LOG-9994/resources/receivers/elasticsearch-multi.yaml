apiVersion: v1
kind: Pod
metadata:
  name: test-elasticsearch-multi
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
    app: test-elasticsearch-multi
spec:
  securityContext:
    runAsUser: 2000
  containers:
  - name: es-node-1
    image: quay.io/openshift-logging/elasticsearch:8.17.5
    env:
    - name: discovery.type
      value: single-node
    - name: xpack.security.enabled
      value: "false"
    - name: ES_JAVA_OPTS
      value: "-Xms256m -Xmx256m"
    - name: HOME
      value: /tmp
    - name: node.name
      value: es-node-1
    ports:
    - name: http
      containerPort: 9200
    readinessProbe:
      httpGet:
        path: /_cluster/health
        port: 9200
      initialDelaySeconds: 30
      periodSeconds: 10
  - name: es-node-2
    image: quay.io/openshift-logging/elasticsearch:8.17.5
    env:
    - name: discovery.type
      value: single-node
    - name: xpack.security.enabled
      value: "false"
    - name: ES_JAVA_OPTS
      value: "-Xms256m -Xmx256m"
    - name: HOME
      value: /tmp
    - name: node.name
      value: es-node-2
    - name: http.port
      value: "9800"
    ports:
    - name: http
      containerPort: 9800
    readinessProbe:
      httpGet:
        path: /_cluster/health
        port: 9800
      initialDelaySeconds: 30
      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: es-node-1
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
spec:
  selector:
    app: test-elasticsearch-multi
  ports:
  - name: http
    port: 9200
    targetPort: 9200
---
apiVersion: v1
kind: Service
metadata:
  name: es-node-2
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
spec:
  selector:
    app: test-elasticsearch-multi
  ports:
  - name: http
    port: 9800
    targetPort: 9800
