# Scenario: endpoints only, no url (exercises AC "url field is optional" + "endpoints field").
# endpoints = [test-es-1, test-es-2]. Generated Vector config must list both and contain no url.
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: test-endpoints-only
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
spec:
  serviceAccount:
    name: test-collector-sa
  outputs:
  - name: es-eo
    type: elasticsearch
    elasticsearch:
      endpoints:
      - http://test-es-1.openshift-logging.svc:9200
      - http://test-es-2.openshift-logging.svc:9200
      version: 8
      index: 'verify-{.log_type||"none"}'
  pipelines:
  - name: app-pipe
    inputRefs:
    - application
    outputRefs:
    - es-eo
