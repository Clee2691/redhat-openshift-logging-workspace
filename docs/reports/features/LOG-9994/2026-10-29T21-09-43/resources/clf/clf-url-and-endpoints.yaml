# Scenario: url + endpoints combined.
# url = test-es-1, endpoints = [test-es-2] ONLY. If the generated Vector config lists
# endpoints = [test-es-1, test-es-2] with test-es-1 FIRST, then `url` was prepended to the
# endpoints list (AC: "When both url and endpoints are set, url is prepended").
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: test-url-and-endpoints
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
spec:
  serviceAccount:
    name: test-collector-sa
  outputs:
  - name: es-ue
    type: elasticsearch
    elasticsearch:
      url: http://test-es-1.openshift-logging.svc:9200
      endpoints:
      - http://test-es-2.openshift-logging.svc:9200
      version: 8
      index: 'verify-{.log_type||"none"}'
  pipelines:
  - name: app-pipe
    inputRefs:
    - application
    outputRefs:
    - es-ue
