# CLF exercising AC5: url + endpoints combined. The operator must prepend `url`
# (test-es-1) to the `endpoints` list (test-es-2) in the generated Vector config,
# so the generated endpoints array is [test-es-1, test-es-2] in that order.
apiVersion: observability.openshift.io/v1
kind: ClusterLogForwarder
metadata:
  name: test-url-and-endpoints
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
spec:
  serviceAccount:
    name: test-collector-sa
  outputs:
  - name: es-multi
    type: elasticsearch
    elasticsearch:
      url: http://test-es-1.openshift-logging.svc:9200
      endpoints:
      - http://test-es-2.openshift-logging.svc:9200
      version: 8
      index: verify-{.log_type||"none"}
  pipelines:
  - name: app-to-es
    inputRefs:
    - application
    outputRefs:
    - es-multi
