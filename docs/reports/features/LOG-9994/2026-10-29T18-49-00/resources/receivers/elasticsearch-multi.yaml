# Two independent single-node Elasticsearch receivers (test-es-1, test-es-2),
# each with its own Service. Used as the two endpoints of the multi-endpoint
# Elasticsearch output. HTTP only (xpack security disabled) so output URLs are http://.
apiVersion: v1
kind: Pod
metadata:
  name: test-es-1
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
    app: test-es-1
spec:
  serviceAccountName: test-es-sa
  securityContext:
    runAsUser: 2000
  containers:
  - name: elasticsearch
    image: quay.io/openshift-logging/elasticsearch:8.17.5
    env:
    - name: discovery.type
      value: single-node
    - name: xpack.security.enabled
      value: "false"
    - name: ES_JAVA_OPTS
      value: "-Xms512m -Xmx512m"
    - name: HOME
      value: /tmp
    ports:
    - containerPort: 9200
    readinessProbe:
      httpGet:
        path: /_cluster/health
        port: 9200
      initialDelaySeconds: 30
      periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: test-es-1
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
spec:
  selector:
    app: test-es-1
  ports:
  - port: 9200
    targetPort: 9200
---
apiVersion: v1
kind: Pod
metadata:
  name: test-es-2
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
    app: test-es-2
spec:
