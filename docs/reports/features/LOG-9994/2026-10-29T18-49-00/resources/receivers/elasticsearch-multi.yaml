---
apiVersion: v1
kind: Service
metadata:
  name: test-es-2
  namespace: openshift-logging
  labels:
    rhol-verify: "LOG-9994"
spec:
  selector:
    app: test-es-2
  ports:
  - port: 9200
    targetPort: 9200
