# Mirror the pre-GA openshift-logging images by digest from the stage
# registry. The pull secret must carry registry.stage.redhat.io credentials
# (checked by deploy.sh before anything is applied). Applied idempotently.
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  name: zstream-validation-logging-mirror
spec:
  imageDigestMirrors:
  - source: registry.redhat.io/openshift-logging
    mirrors:
    - registry.stage.redhat.io/openshift-logging
